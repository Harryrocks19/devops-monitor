version: "3.9"

services:
  app:
    build: .
    container_name: devops-monitor
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: always
    volumes:
      - ./metrics.log:/app/metrics.log

  db:
    image: postgres:15-alpine
    container_name: devops-postgres
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB:       devops_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
